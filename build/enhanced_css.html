<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface-subtle: #f3f1ec;
    --surface-hover: #ece9e1;
    --ink: #141b24;
    --ink-secondary: #475467;
    --muted: #667085;
    --border: #e4e1d8;
    --border-strong: #d0ccc0;

    /* Brand & Clinical Accents */
    --brand: #1e4d3b;
    --brand-dark: #143629;
    --brand-soft: #ecfdf5;
    --brand-border: #a7f3d0;

    --select: #4f46e5;
    --select-dark: #4338ca;
    --select-soft: #eef2ff;
    --select-ring: rgba(79, 70, 229, 0.22);

    /* Severity Spectrum */
    --sev-none: #059669;
    --sev-none-bg: #ecfdf5;
    --sev-none-border: #a7f3d0;

    --sev-mild: #d97706;
    --sev-mild-bg: #fffbeb;
    --sev-mild-border: #fde68a;

    --sev-mod: #ea580c;
    --sev-mod-bg: #fff7ed;
    --sev-mod-border: #fed7aa;

    --sev-sev: #e11d48;
    --sev-sev-bg: #fff1f2;
    --sev-sev-border: #fecdd3;

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;

    --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-sm: 0 2px 8px -2px rgba(16, 24, 40, 0.06), 0 1px 3px -1px rgba(16, 24, 40, 0.04);
    --shadow-md: 0 12px 28px -6px rgba(16, 24, 40, 0.08), 0 4px 10px -2px rgba(16, 24, 40, 0.04);
    --shadow-lg: 0 20px 40px -12px rgba(16, 24, 40, 0.14);

    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background-color: var(--bg);
    background-image:
      radial-gradient(at 0% 0%, rgba(30, 77, 59, 0.06) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(79, 70, 229, 0.045) 0px, transparent 45%);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.6;
    padding-bottom: 64px;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     STICKY GLASSMORPHIC TOP BAR
     ========================================================= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(248, 247, 244, 0.84);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(228, 225, 216, 0.85);
    padding: 12px 20px;
  }

  .topbar-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .brand-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand), #2c6e54);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 2px 6px rgba(30, 77, 59, 0.25);
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Mode Switcher Segmented Control */
  .segmented {
    display: inline-flex;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .segmented button {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.16s ease;
  }

  .segmented button:hover {
    color: var(--ink);
  }

  .segmented button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-xs);
  }

  .btn-mini {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .btn-mini:hover {
    background: var(--surface-subtle);
    border-color: var(--border-strong);
    color: var(--ink);
  }

  /* Segmented 13-Pill Progress Tracker */
  .progress-strip {
    max-width: 920px;
    margin: 10px auto 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pill-track {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 5px;
  }

  .prog-pill {
    height: 8px;
    border-radius: 999px;
    background: #e2dfd7;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .prog-pill:hover {
    transform: scaleY(1.35);
    background: #c5c0b4;
  }

  .prog-pill.answered {
    background: var(--brand);
  }

  .prog-pill.current {
    background: var(--select);
    box-shadow: 0 0 0 3px var(--select-ring);
    transform: scaleY(1.25);
  }

  .prog-pill.missing-pill {
    background: var(--sev-sev);
  }

  .progress-counter {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-secondary);
    white-space: nowrap;
  }

  /* =========================================================
     MAIN CONTAINER & HERO HEADER
     ========================================================= */
  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  .hero {
    margin-bottom: 24px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--brand);
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .hero p {
    margin: 0;
    font-size: 15.5px;
    color: var(--ink-secondary);
    max-width: 680px;
  }

  .clinical-notice {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brand);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-xs);
    font-size: 13.5px;
    color: var(--ink-secondary);
  }

  .clinical-notice svg {
    flex-shrink: 0;
    color: var(--brand);
    margin-top: 2px;
  }

  .clinical-notice strong {
    color: var(--ink);
  }

  /* =========================================================
     QUESTIONNAIRE CARDS & 8-POINT FREQUENCY SCALE
     ========================================================= */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .card-top h2 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.015em;
    margin: 0 0 4px;
  }

  .card-top .subtext {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0;
  }

  .kbd-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 8px;
  }

  .kbd-hint kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink);
  }

  /* Question Block */
  .q-block {
    padding: 20px 16px;
    margin: 0 -16px;
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius-md);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .q-block:last-child {
    border-bottom: none;
  }

  .q-block.is-missing {
    background: var(--sev-sev-bg);
    box-shadow: inset 4px 0 0 var(--sev-sev);
  }

  /* Focus Mode Single Card Animation */
  .focus-stage {
    min-height: 270px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .focus-slide {
    animation: slideFade 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .q-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .q-clin-badge {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--select);
    background: var(--select-soft);
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: none;
    letter-spacing: 0;
  }

  .q-missing-label {
    display: none;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--sev-sev);
    background: #ffe4e6;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .q-block.is-missing .q-missing-label {
    display: inline-block;
  }

  .q-stem {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.45;
    margin-bottom: 16px;
  }

  .focus-stage .q-stem {
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 22px;
  }

  /* 8-Point Tactile Grid */
  .scale-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
  }

  .scale-option {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    background: var(--surface-subtle);
    border: 1.5px solid var(--border);
    border-radius: 11px;
    padding: 10px 6px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .scale-option:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: var(--shadow-xs);
  }

  .scale-option:active {
    transform: scale(0.97);
  }

  .scale-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .opt-num {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    margin-bottom: 6px;
    transition: all 0.15s ease;
  }

  .opt-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
    line-height: 1.25;
  }

  /* Checked State */
  .scale-option:has(input:checked) {
    background: var(--select);
    border-color: var(--select);
    box-shadow: 0 6px 16px -4px rgba(79, 70, 229, 0.4), 0 0 0 3px var(--select-ring);
    transform: translateY(-2px);
  }

  .scale-option:has(input:checked) .opt-num {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff;
  }

  .scale-option:has(input:checked) .opt-label {
    color: #ffffff;
  }

  /* Focus Mode Navigation Footer */
  .focus-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  /* Inline Error Banner */
  .error-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--sev-sev-bg);
    border: 1px solid var(--sev-sev-border);
    color: var(--sev-sev);
    border-radius: var(--radius-md);
    padding: 13px 16px;
    font-size: 13.5px;
    font-weight: 600;
    margin-top: 18px;
  }

  .error-banner.show {
    display: flex;
  }

  /* Primary & Secondary Action Buttons */
  .action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--font-sans);
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.16s ease;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--brand);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(30, 77, 59, 0.24);
  }

  .btn-primary:hover {
    background: var(--brand-dark);
    box-shadow: 0 6px 16px rgba(30, 77, 59, 0.3);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border-strong);
  }

  .btn-secondary:hover {
    background: var(--surface-subtle);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  /* =========================================================
     DIAGNOSTIC RESULTS DASHBOARD
     ========================================================= */
  .results-panel {
    display: none;
    animation: revealDashboard 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .results-panel.show {
    display: block;
  }

  @keyframes revealDashboard {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dashboard-hero {
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 28px;
    align-items: center;
    padding: 26px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, #faf9f6 100%);
    margin-bottom: 22px;
  }

  /* SVG Radial Gauge */
  .gauge-box {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 0 auto;
    display: grid;
    place-items: center;
  }

  .gauge-svg {
    width: 190px;
    height: 190px;
    transform: rotate(-90deg);
  }

  .gauge-track {
    fill: none;
    stroke: #e9e6de;
    stroke-width: 14;
  }

  .gauge-fill {
    fill: none;
    stroke: var(--sev-none);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 477.52;
    stroke-dashoffset: 477.52;
    transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.4s ease;
  }

  .gauge-center {
    position: absolute;
    text-align: center;
  }

  .gauge-score {
    font-family: var(--font-mono);
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
  }

  .gauge-denom {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 4px;
  }

  .severity-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    border: 1px solid transparent;
  }

  .sev-none { background: var(--sev-none-bg); color: var(--sev-none); border-color: var(--sev-none-border); }
  .sev-mild { background: var(--sev-mild-bg); color: var(--sev-mild); border-color: var(--sev-mild-border); }
  .sev-moderate { background: var(--sev-mod-bg); color: var(--sev-mod); border-color: var(--sev-mod-border); }
  .sev-severe { background: var(--sev-sev-bg); color: var(--sev-sev); border-color: var(--sev-sev-border); }

  .diagnosis-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  .diagnosis-summary {
    font-size: 14.5px;
    color: var(--ink-secondary);
    margin: 0;
    line-height: 1.55;
  }

  /* Clinical Significance & Gate Cards */
  .gate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .gate-card {
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
  }

  .gate-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .gate-label {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .gate-status {
    font-size: 12px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .gate-met { background: #dcfce7; color: #166534; }
  .gate-unmet { background: #e5e7eb; color: #4b5563; }

  .gate-val {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .gate-explain {
    font-size: 13px;
    color: var(--ink-secondary);
    margin: 0;
    line-height: 1.45;
  }

  /* 11 DSM-5 Criteria Breakdown Table with Visual Threshold Bars */
  .table-shell {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow-x: auto;
    background: var(--surface);
  }

  table.dsm-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  table.dsm-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    background: var(--surface-subtle);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  table.dsm-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  table.dsm-table tr:last-child td {
    border-bottom: none;
  }

  table.dsm-table tr.row-met td {
    background: rgba(236, 253, 245, 0.55);
  }

  .mono-cell {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12.5px;
    white-space: nowrap;
  }

  /* Miniature 0–7 Threshold Comparison Bar */
  .thresh-viz {
    min-width: 130px;
  }

  .thresh-track {
    position: relative;
    height: 10px;
    background: #eae7df;
    border-radius: 999px;
    overflow: visible;
  }

  .thresh-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  .thresh-fill.is-met {
    background: var(--sev-none);
  }

  .thresh-fill.is-unmet {
    background: #94a3b8;
  }

  .thresh-marker {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2.5px;
    background: var(--ink);
    border-radius: 2px;
    z-index: 2;
  }

  .thresh-caption {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 5px;
  }

  .crit-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .crit-pill.met {
    background: #dcfce7;
    color: #166534;
  }

  .crit-pill.unmet {
    background: #f3f4f6;
    color: #6b7280;
  }

  .crit-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .crit-pill.met .crit-dot { background: var(--sev-none); }
